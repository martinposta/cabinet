<meta property="og:description" content="Left: An authentic pencil sketch drawn by H. P. Lovecraft himself. Formerly housed in a Chicago historical museum and now held in a private collection, this rare piece proves that a simple pencil and a bit of talent are all it takes to summon cosmic dread.

Right: A widely shared, internet-famous ink drawing that is actually a remarkably bad forgery. The clumsy attempt to artificially age the paper looks less like centuries of patina and more like an unfortunate accident with a wet tea bag. It serves as a prime showcase of what happens when an amateur tries to copy a genius.

Year created: 1934
Dimensions left: 22 x 15,5 cm, right: 22,5 x 17,2 cm">
