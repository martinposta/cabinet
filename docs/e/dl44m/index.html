<meta property="og:description" content="The DL-44M is a customized variant of the iconic DL-44 blaster, designed with a focus on mobility and efficiency. Unlike the standard model, it lacks a telescopic sight, making it a lighter and more compact weapon. Thanks to these features, it became a favored choice among Rebel agents and spies during covert missions against the Empire, where stealth and speed were essential. Its ergonomically redesigned grip allows for better handling and improved accuracy in narrow corridors and the confined spaces of Imperial bases.">
