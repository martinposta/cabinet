<meta property="og:description" content="Compiled in 1513 by Ottoman admiral and cartographer Piri Reis, this legendary world map was proudly presented to Sultan Selim I right after the conquest of Egypt. What the ruler actually did with it remains a total mystery, as the map promptly vanished from history for centuries, seemingly tucked away in a very deep drawer.

When the surviving one-third was finally rediscovered in 1929 at Istanbul&#39;s Topkapi Palace, it caused an international sensation. Experts realized that Piri Reis had copied a portion of an otherwise lost map drawn by Christopher Columbus himself. In short, you are looking at the most valuable and historic piece of copied homework in the history of navigation.">
