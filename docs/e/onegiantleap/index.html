<meta property="og:description" content="This original print of The New York Times covering the Moon landing is a collector&#39;s dream, though it was a total nightmare for the paper&#39;s management at the time. When the editor-in-chief did a final check and discovered that an underpaid editor had slipped in a bit of sabotage to discredit the newspaper, all hell broke loose.

The entire print run was immediately destroyed before it could ever hit the newsstands. Despite every effort to wipe the mistake off the face of the Earth, a few of these rogue copies managed to survive as a priceless reminder that you should never skimp on your editors&#39; salaries.

Year printed: July 20, 1969
Dimensions: 54,7 x 34,1 cm">
