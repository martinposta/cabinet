<meta property="og:description" content="When Japanese artist Utagawa Kuniyoshi finished the now famous triptych Soma no furudairi in 1844, he had no idea where his art would take him. Not long after completing it, he was persuaded by Dutch envoys who begged him for a showcase of true Japanese beauty and aesthetics for King William II.
Instead of a boring diplomatic gift, however, the Dutch monarch got a hefty serving of drama, sorcery, and calcium featuring samurais battling a giant skeleton. It makes the ideal bedroom decor if you want to be sure your wake-up call comes from rattling bones rather than a normal alarm clock.">
