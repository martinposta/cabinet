<meta property="og:description" content="Before tackling his famous 17-foot masterpiece, Michelangelo carved this smaller scale model just to make sure he could nail the nose. Think of it as a rough draft, only chiseled out of top-shelf Italian marble instead of sketched on paper.

Mysteriously lost for centuries, the head resurfaced a few years ago and was promptly snapped up by a private collector. Experts consider its value &quot;priceless,&quot; which in the art world is speak for a number that makes even billionaires break into a cold sweat.

Year created: Early 1501
Dimensions: 30,6 x 21,8 x 19,2 cm">
