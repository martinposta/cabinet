<meta property="og:description" content="Founded in Edinburgh in the 19th century, the Scottish firm John Bartholomew and Co. practically held a monopoly on putting the world on paper. In the 1830s, they landed the contract to produce maps for the famous Encyclopedia Britannica, a gig they managed to keep for a solid ninety years. As the British Empire expanded abroad and education boomed at home, their atlases sold like hotcakes.

We actually have this family business to thank for the brilliant idea of coloring British territories bright red so everyone could immediately see who owned half the planet, as well as the use of color gradients to show elevation. Thanks to their innovations, you can now get lost in the mountains with much better style and a clear idea of how steep the climb is going to be.

Year created: 2002
Dimensions: 50 x 75">
