<style>
/* Layout: an endless flocked-green wall; framed works packed in a spiral from the centre outward, click-and-drag pan, wheel zoom toward cursor, no camera easing. Single deliberate dark look. */
:root{
  --wall:#163126;
  --wall-deep:#0a1a12;
  --flock:rgba(132,182,140,.10);
  --gilt:#c9a24a;
  --gilt-hi:#f3d98b;

  --f-body:"Spectral", "Iowan Old Style", Georgia, serif;

[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);touch-action:none;-webkit-font-smoothing:antialiased}

#wall{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;background:var(--wall)}
#world{position:fixed;left:0;top:0;transform-origin:0 0;will-change:transform;contain:layout style}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 78% at 50% 50%,transparent 38%,rgba(0,0,0,.55) 72%,#000 100%)}
.glow{position:fixed;left:0;top:0;width:900px;height:900px;margin:-450px 0 0 -450px;pointer-events:none;will-change:transform,opacity;background:radial-gradient(circle closest-side,rgba(255,176,84,.20),rgba(255,160,70,.08) 45%,transparent)}
/* candlelight: a small gradient texture the compositor scales up and moves with the pointer; never repainted per frame */
.dark{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;pointer-events:none}

/* ---------- frames ---------- */
.hang{position:absolute;animation:hangIn .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i) * 75ms + 120ms)}
@keyframes hangIn{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
.wire{position:absolute;left:0;top:-46px;width:100%;height:60px;overflow:visible;pointer-events:none}
.frame{position:relative;box-sizing:border-box;padding:var(--fw);transform:rotate(var(--tilt));transition:transform .35s cubic-bezier(.2,.7,.2,1);outline:none}
#world,#wall{cursor:grab;-webkit-user-select:none;user-select:none;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging .frame.work,body.dragging .shelf.work,body.dragging .cabinet *{pointer-events:none}
/* cabinet: walnut chest of drawers; its foot is always below the page end */

.cab-top::after{content:"";position:absolute;inset:6px 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 1px,transparent 1px 9px,rgba(255,220,170,.05) 9px 10px,transparent 10px 23px)}
.cab-body{position:absolute;left:22px;right:22px;top:34px;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 11px,rgba(255,215,160,.04) 11px 12px,transparent 12px 27px),linear-gradient(90deg,#2e1b0c,#4f311a 12%,#43291a 50%,#52331c 88%,#2c190b);box-shadow:inset 0 12px 16px rgba(0,0,0,.55)}
.drawer{position:absolute}
.drawer.open{z-index:2}
.tray{position:absolute;inset:0;background:#1a1009;box-shadow:inset 0 0 0 7px #3b2412,inset 0 16px 20px rgba(0,0,0,.9);overflow:hidden}

.tray .item{position:absolute;display:block;max-width:none;filter:drop-shadow(4px 6px 4px rgba(0,0,0,.6))}
.tray .item.work{cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.tray .item.work:hover,.tray .item.work:focus-visible{transform:translateY(-4px)}
.tray .item.work:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.tray .tag{position:absolute;font-family:var(--f-label);font-size:12px;letter-spacing:.06em;color:#2a2117;background:#e9dcbb;padding:2px 7px 3px;transform:rotate(-4deg);box-shadow:1px 2px 3px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none}

.front{position:absolute;inset:0;border-radius:2px;cursor:pointer;outline:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 13px,rgba(255,215,160,.05) 13px 14px,transparent 14px 31px),linear-gradient(180deg,#6d4627,#523319 55%,#5e3c20);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),0 2px 3px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.front::before{content:"";position:absolute;inset:13px;border-radius:2px;box-shadow:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,220,170,.12),1px 1px 0 rgba(255,220,170,.10),-1px -1px 0 rgba(0,0,0,.45)}
.front:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.front svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:visible}

.cab-obj{position:absolute;display:block;max-width:none;filter:drop-shadow(8px 8px 7px rgba(0,0,0,.55))}

.liner{position:relative;box-sizing:border-box;width:100%;height:100%;padding:6px;background:var(--liner,#1c2a20)}
.liner img{display:block;width:100%;height:100%;max-width:none;background:#0c1510}

.m-gold{background:repeating-linear-gradient(45deg,rgba(70,40,5,.16) 0 2px,transparent 2px 6px),linear-gradient(135deg,#6e4f17 0%,#e8c66e 17%,#9a7224 33%,#f6dc93 50%,#8a6420 66%,#d9b55a 83%,#5e4313 100%)}
.m-antique{background:repeating-linear-gradient(-45deg,rgba(30,18,4,.2) 0 2px,transparent 2px 5px),linear-gradient(135deg,#4a3512 0%,#b99242 22%,#6b5020 42%,#cfae62 58%,#5c4519 78%,#a3803a 100%)}
.m-walnut{--liner:linear-gradient(135deg,#8a6420,#e2c174,#8a6420);background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px,rgba(255,220,180,.04) 4px 5px,transparent 5px 9px),linear-gradient(160deg,#2c1a0f,#5b3a22 35%,#3a2416 60%,#6a4429 85%,#2a180d)}
.m-ebony{--liner:linear-gradient(135deg,#7a5a1e,#e8c66e,#7a5a1e);background:linear-gradient(135deg,#0d0b09,#2d2722 30%,#100d0b 55%,#3a332c 78%,#0b0907)}
.m-verdigris{--liner:#14211b;background:repeating-linear-gradient(45deg,rgba(220,190,110,.12) 0 1px,transparent 1px 5px),linear-gradient(135deg,#2f4a3b,#8fae8a 22%,#4f6e52 42%,#b9c79c 58%,#456349 78%,#7f9a6f)}
.m-oxblood{--liner:linear-gradient(135deg,#8a6420,#e8c66e,#8a6420);background:linear-gradient(135deg,#2a0a0b,#6e1d1c 30%,#3b0f10 55%,#7c2624 78%,#250808)}
.frame{box-shadow:inset 0 0 0 2px rgba(255,236,180,.28),inset 0 0 0 4px rgba(40,22,4,.45),inset 0 0 calc(var(--fw) * .9) rgba(30,14,0,.55),0 22px 36px rgba(0,0,0,.55),0 5px 10px rgba(0,0,0,.45)}
.orn{position:absolute;inset:-5px;pointer-events:none;--o:calc(var(--fw) * 1.55);background:var(--rosette) top left/var(--o) var(--o) no-repeat,var(--rosette) top right/var(--o) var(--o) no-repeat,var(--rosette) bottom left/var(--o) var(--o) no-repeat,var(--rosette) bottom right/var(--o) var(--o) no-repeat,var(--crest) top center/calc(var(--o) * 2.2) var(--o) no-repeat}

.plaque{position:absolute;left:50%;top:calc(100% + 16px);transform:translateX(-50%);white-space:nowrap;padding:5px 14px 6px;font-family:var(--f-label);font-size:14px;letter-spacing:.06em;color:#2a1d0b;background:linear-gradient(180deg,#e9cf8c,#b8954a 55%,#9c7a35);border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,245,210,.6),inset 0 -1px 0 rgba(60,35,5,.5);text-shadow:0 1px 0 rgba(255,240,200,.45);pointer-events:none}
.plaque b{font-weight:400;color:#6b2a14;margin-right:.5em}

/* ---------- HUD ---------- */
/* shelves: a plank on two iron brackets, one object standing on it */
.shelf{position:relative;outline:none}
.shelf.work{cursor:pointer}
.shelf .obj{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.shelf.work:hover .obj,.shelf.work:focus-visible .obj{transform:translateY(-6px)}
.shelf.work:focus-visible{outline:2px solid var(--ink);outline-offset:8px}
.shelf .obj{position:absolute;display:block;max-width:none;filter:drop-shadow(8px 10px 7px rgba(0,0,0,.5))}
.shelf .plank{position:absolute;left:0;right:0;height:18px;border-radius:2px;background:linear-gradient(180deg,#a87a4c 0,#7c5530 4px,#5b3b20 5px,#4a2f19 60%,#38230f 100%);box-shadow:0 12px 14px rgba(0,0,0,.5),0 3px 4px rgba(0,0,0,.45),inset 0 -1px 0 rgba(0,0,0,.4)}
.shelf .plank::before{content:"";position:absolute;inset:5px 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 7px,rgba(255,220,170,.05) 7px 8px,transparent 8px 15px)}
.shelf .brackets{position:absolute;left:0;width:100%;overflow:visible}
/* nameplate: engraved gilt cartouche screwed to the wall above the centre piece */
.nameplate{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-bottom:4px;background-size:100% 100%;filter:drop-shadow(0 14px 16px rgba(0,0,0,.55)) drop-shadow(0 3px 4px rgba(0,0,0,.5));animation:plateIn .9s cubic-bezier(.2,.7,.2,1) both;pointer-events:none}
@keyframes plateIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.nameplate h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:54px;line-height:1;letter-spacing:.015em;color:#3b2707;text-shadow:0 1px 0 rgba(255,242,200,.55),0 -1px 0 rgba(60,36,4,.35)}
.nameplate p{margin:0;font-family:var(--f-label);font-size:15px;letter-spacing:.24em;color:#5a3d10;text-shadow:0 1px 0 rgba(255,242,200,.5)}
.btn{font:inherit;font-family:var(--f-label);font-size:14px;letter-spacing:.08em;color:#2a1d0b;padding:6px 14px;border:0;border-radius:2px;cursor:pointer;background:linear-gradient(180deg,#e9cf8c,#b8954a 60%,#9c7a35);box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,245,210,.6)}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(4,11,7,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .35s ease both;overflow:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.viewer-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:36px;align-items:center;width:min(1240px,100%);animation:liftIn .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes liftIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.stage-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}

.stage{position:relative;aspect-ratio:var(--ar);background:#0c1510;overflow:hidden;max-width:100%}

.stage img.on{opacity:1}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 4px 22px rgba(0,0,0,.7)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,217,139,.5);background:rgba(10,22,15,.7);color:var(--gilt-hi);font-size:22px;line-height:1;cursor:pointer;font-family:var(--f-display)}

.nav:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nav.prev{left:-6px}.nav.next{right:-6px}
.slide-meta{display:flex;gap:14px;align-items:baseline;color:var(--ink-dim);font-style:italic;font-size:14px;flex-wrap:wrap;justify-content:center}
.slide-meta .count{font-family:var(--f-label);font-style:normal;letter-spacing:.14em;color:var(--gilt-hi);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--gilt);background:transparent;cursor:pointer}
.dots button[aria-current="true"]{background:var(--gilt)}
.card{position:relative;background:var(--paper);color:var(--paper-ink);padding:26px 26px 24px;box-shadow:0 18px 40px rgba(0,0,0,.5);background-image:linear-gradient(rgba(120,90,40,.05) 1px,transparent 1px);background-size:100% 26px;min-width:0}
.card .inv{font-family:var(--f-label);letter-spacing:.14em;color:var(--red-ink);font-size:14px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.05;margin:6px 0 4px;text-wrap:balance}
.card .medium{font-style:italic;color:#5b4a33;margin:0 0 14px;font-size:15px}
.card p.desc{font-size:16px;line-height:1.55;margin:0 0 16px;max-width:60ch}
.card ul{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid rgba(42,33,23,.25);display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-label);letter-spacing:.08em;font-size:13px;color:#5b4a33}
.card .note{margin:16px 0 0;font-size:13px;font-style:italic;color:#7a6647}
.close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:21;width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,217,139,.5);background:rgba(10,22,15,.8);color:var(--gilt-hi);font-size:26px;line-height:1;cursor:pointer}
.close:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

@media (max-width:820px){
  .viewer{align-items:flex-start}
  .viewer-inner{grid-template-columns:1fr;gap:20px;padding-top:44px}
  .stage-frame{--fw:16px;padding:16px;width:100%}

@media (prefers-reduced-motion:reduce){
  .hang,.viewer,.viewer-inner{animation:none}
  .frame,.stage img{transition:none}
}
</style>

}
function texture(c,w,h,r){

  for(let i=0;i<40;i++){
    c.strokeStyle=r()<.5?"rgba(255,235,200,.025)":"rgba(0,0,0,.05)"; c.lineWidth=3+r()*12;
    const x=r()*w,y=r()*h; c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+(r()-.5)*80,y+(r()-.5)*40,x+(r()-.5)*160,y+(r()-.5)*60); c.stroke();

}

function paintArt(ctx,w,h,item,v){
  const r=R(item.seed*977+v*131+7);
  ctx.save();
  if(v===1||v===3){ const z=v===1?1.75:1.35, fx=w*(.3+r()*.4), fy=h*(.3+r()*.4); ctx.translate(fx,fy); ctx.scale(z,z); ctx.translate(-fx,-fy); }
  ART[item.art](ctx,w,h,R(item.seed*31+(v===2?999:0)),v);
  ctx.restore();
  texture(ctx,w,h,R(item.seed+5+v));
  varnish(ctx,w,h,v===3);
}

/* ================= layout: spiral from the centre ================= */
const PAD_TOP=44, GAP=30;
const PLATE={w:540,h:132,lift:40,room:70}; // size, gap above the centre frame's nail, clear space around it
function layout(items){
  const rng=R(4242), placed=[];
  const hit=(b)=>placed.some(p=>b.x0<p.x1+GAP&&b.x1>p.x0-GAP&&b.y0<p.y1+GAP&&b.y1>p.y0-GAP);
  const boxAt=(it,x,y)=>({x0:x-it.ow/2,x1:x+it.ow/2,y0:y-it.oh/2-PAD_TOP,y1:y+it.oh/2+it.padB});
  items.forEach((it,k)=>{
    if(k===0){
      it.x=0; it.y=0; placed.push(boxAt(it,0,0));
      PLATE.x=0; PLATE.y=-it.oh/2-PAD_TOP-PLATE.lift-PLATE.h/2;
      placed.push({x0:-PLATE.w/2-PLATE.room,x1:PLATE.w/2+PLATE.room,y0:PLATE.y-PLATE.h/2-PLATE.room,y1:PLATE.y+PLATE.h/2});
      return;
    }
    let best=null;
    const N=72, off=rng()*Math.PI*2/N;
    for(let a=0;a<N;a++){
      const ang=off+a/N*Math.PI*2, cs=Math.cos(ang), sn=Math.sin(ang);
      for(let rad=40;rad<6000;rad+=10){
        const x=cs*rad, y=sn*rad*.8, b=boxAt(it,x,y);
        if(!hit(b)){ const score=Math.hypot(x,y*1.45)+rng()*30; if(!best||score<best.s) best={s:score,x,y,b}; break; }
      }
    }
    it.x=best.x; it.y=best.y; placed.push(best.b);
  });
  const B={x0:Infinity,x1:-Infinity,y0:Infinity,y1:-Infinity};
  placed.forEach(p=>{B.x0=Math.min(B.x0,p.x0);B.x1=Math.max(B.x1,p.x1);B.y0=Math.min(B.y0,p.y0);B.y1=Math.max(B.y1,p.y1);});
  B.cx=(B.x0+B.x1)/2; B.cy=(B.y0+B.y1)/2; B.w=B.x1-B.x0; B.h=B.y1-B.y0;
  return B;
}

      <radialGradient id='sc' cx='.35' cy='.3'><stop offset='0' stop-color='#fff1bf'/><stop offset='.55' stop-color='#c9a24a'/><stop offset='1' stop-color='#5e420f'/></radialGradient>

      <clipPath id='c'><path d='${outer}'/></clipPath>
    </defs>
    <path d='${outer}' fill='url(#g)'/>
    <g clip-path='url(#c)'><rect width='${W}' height='${H}' fill='url(#br)'/><rect width='${W}' height='${H}' fill='url(#sheen)'/></g>
    <path d='${outer}' fill='none' stroke='#4a3008' stroke-width='3'/>
    <path d='${outer}' fill='none' stroke='rgba(255,244,205,.55)' stroke-width='1.2' transform='translate(${W*0.003} 1.5) scale(.994 .977)'/>
    <path d='${inner}' fill='none' stroke='rgba(70,44,8,.55)' stroke-width='1.6'/>
    <path d='${inner}' fill='none' stroke='rgba(255,240,200,.45)' stroke-width='1' transform='translate(0 1.4)'/>
    <path d='M${W/2-206} ${H*.7}H${W/2-166}M${W/2+166} ${H*.7}H${W/2+206}' stroke='rgba(70,44,8,.5)' stroke-width='1.2'/>
    ${screw(30)}${screw(W-30)}
  </svg>`;
  const el=document.createElement("div"); el.className="nameplate";
  el.style.cssText=`left:${PLATE.x-W/2}px;top:${PLATE.y-H/2}px;width:${W}px;height:${H}px;background-image:url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  el.innerHTML=`<h1>Kabinet kuriozit</h1><p>Osobní projekty · ${EXHIBIT_COUNT} exponátů</p>`;
  world.prepend(el);
})();

// paint each picture once into a scratch canvas, then hang it as a static image (cheap to composite)
const scratch=document.createElement("canvas");
async function paintAll(){
  for(const it of ORDER.concat(CAB_ITEMS)){
    scratch.width=it.aw*2; scratch.height=it.ah*2;
    const ctx=scratch.getContext("2d");
    if(it.shelf){ ctx.clearRect(0,0,scratch.width,scratch.height); OBJ[it.shelf](ctx,scratch.width,scratch.height,R(it.seed)); }
    else paintArt(ctx,scratch.width,scratch.height,it,0);
    const blob=await new Promise(res=>scratch.toBlob(res,it.shelf?"image/png":"image/jpeg",.9));
    it.img.src=URL.createObjectURL(blob);
    await new Promise(res=>setTimeout(res,0)); // yield so the page stays responsive while painting
  }
}
Promise.race([document.fonts.ready,new Promise(res=>setTimeout(res,1800))]).then(paintAll);

/* ================= camera ================= */
const wall=document.getElementById("wall"), wctx=wall.getContext("2d");
let wallPat=null, wallDpr=1, rasterZ=0, settle=0;
function sizeWall(){ wallDpr=Math.min(devicePixelRatio||1,1.5); wall.width=Math.round(innerWidth*wallDpr); wall.height=Math.round(innerHeight*wallDpr); wallPat=null; }
sizeWall();
function drawWall(ox,oy,z){
  if(!wallPat||window.__wallDirty){ wallPat=wctx.createPattern(window.__wallTile,"repeat"); window.__wallDirty=false; }
  const k=z*wallDpr/2;
  wallPat.setTransform(new DOMMatrix([k,0,0,k,ox*wallDpr,oy*wallDpr]));
  wctx.fillStyle=wallPat; wctx.fillRect(0,0,wall.width,wall.height);
}
let vw=innerWidth, vh=innerHeight;
const cam={x:BOUNDS.cx,y:BOUNDS.cy,z:1}, tgt={x:BOUNDS.cx,y:BOUNDS.cy,z:1};
const Z_MAX=1.25; // closest allowed view (world px -> screen px)
const Z_MIN=.7;   // farthest view on a ~1566px-wide window; narrower windows scale it down proportionally
let zMin=.3, zMax=Z_MAX, zHome=1;
let viewerOpen=false, last="";
function fitZooms(){
  vw=innerWidth; vh=innerHeight;
  const P=pad();
  const fitAll=Math.min((vw-2*Math.min(P.l,80))/(WALL.x1-WALL.x0),(vh-P.t)/(WALL.y1-WALL.y0));
  zHome=clamp(Math.min(vw/1250,vh/900),.32,1.1);
  zMin=Z_MIN*Math.min(1,vw/1566); void fitAll; zMax=Z_MAX;
  tgt.z=clamp(tgt.z,zMin,zMax);
}
fitZooms();
{ // opening shot: nameplate + centre frame + its plaque, centred
  const c=ORDER[0], top=PLATE.y-PLATE.h/2, bot=c.y+c.oh/2+c.padB, span=bot-top;
  zHome=clamp(Math.min(vw/1250,(vh-120)/(span+170)),zMin,Math.min(1.1,Z_MAX));
  cam.z=tgt.z=zHome; cam.x=tgt.x=0; cam.y=tgt.y=(top+bot)/2;
}

// screen-space margin around the wall (px), constant at every zoom; top/bottom leave room for the HUD
function pad(){
  const side=Math.max(72,Math.min(440,vw*.26));
  return {l:side,r:side,t:Math.max(72,Math.min(160,vh*.12)),b:Math.max(96,Math.min(180,vh*.14))};
}
// allowed camera-centre range at zoom z, so every wall edge can reach its screen margin
function range(lo,hi,view,pA,pB,z){
  const a=lo-pA/z+view/(2*z), b=hi+pB/z-view/(2*z);
  return a<=b?[a,b]:[(a+b)/2,(a+b)/2];
}
const rangeX=z=>{ const P=pad(); return range(WALL.x0,WALL.x1,vw,P.l,P.r,z); };
// vertically the screen bottom may never pass CUT_Y (the cabinet foot stays hidden); if everything fits, sit on that line
const rangeY=z=>{ const P=pad(), lo=WALL.y0-P.t/z+vh/(2*z), hi=WALL.y1-vh/(2*z); return lo<=hi?[lo,hi]:[hi,hi]; };
function clampTarget(){
  const [x0,x1]=rangeX(tgt.z), [y0,y1]=rangeY(tgt.z);
  tgt.x=clamp(tgt.x,x0,x1); tgt.y=clamp(tgt.y,y0,y1);
}
// rubber band: signed distance past the allowed range (0 when inside)
const overshoot=(v,[lo,hi])=>v<lo?v-lo:v>hi?v-hi:0;

/* ---- drag state ---- */
const drag={active:false,id:null,moved:false,sx:0,sy:0,lx:0,ly:0,lt:0,vx:0,vy:0};
let inertia=false;
// zoom anchor keeps the wall point under the cursor fixed while zoom animates
let anchor=null;
let lastT=performance.now();

function tick(now){
  const dt=Math.min(48,now-lastT); lastT=now;
  if(!viewerOpen){
    if(inertia&&!drag.active){
      tgt.x+=drag.vx*dt; tgt.y+=drag.vy*dt;
      const f=Math.pow(.93,dt/16.7); drag.vx*=f; drag.vy*=f;
      // brake hard if inertia carries past an edge
      if(overshoot(tgt.x,rangeX(tgt.z))) drag.vx*=.6;
      if(overshoot(tgt.y,rangeY(tgt.z))) drag.vy*=.6;
      if(Math.hypot(drag.vx,drag.vy)*cam.z<.01) inertia=false;
      cam.x=tgt.x; cam.y=tgt.y;
    }
    if(!drag.active&&!inertia) clampTarget();
    const kz=1, kp=1; // instant camera: no easing on pan or zoom
    cam.z+=(tgt.z-cam.z)*kz;
    if(Math.abs(tgt.z-cam.z)<.0008) cam.z=tgt.z;
    if(anchor){
      // derive position from zoom so the anchored point never drifts
      cam.x=anchor.wx-(anchor.sx-vw/2)/cam.z; cam.y=anchor.wy-(anchor.sy-vh/2)/cam.z;
      if(cam.z===tgt.z){ anchor=null; tgt.x=cam.x; tgt.y=cam.y; }
    } else if(!drag.active){
      cam.x+=(tgt.x-cam.x)*kp; cam.y+=(tgt.y-cam.y)*kp;
      if(Math.abs(tgt.x-cam.x)*cam.z<.3) cam.x=tgt.x;
      if(Math.abs(tgt.y-cam.y)*cam.z<.3) cam.y=tgt.y;
    }
  }
  // candle flicker: small random swings in reach and warmth
  if(!reduceMotion){
    flickT-=dt;
    if(flickT<=0){ flickTo=1+(Math.random()-.5)*.07; flickT=50+Math.random()*130; }
    const nf=flick+(flickTo-flick)*.22; if(Math.abs(nf-flick)>.0004){ flick=nf; glowDirty=true; }
  }
  if(glowDirty){
    glow.style.transform=`translate3d(${glowX}px,${glowY}px,0) scale(${flick.toFixed(4)})`;
    glow.style.opacity=(.85+(flick-1)*5).toFixed(3);
    glowDirty=false;
  }
  drawDark(dt);
  const key=`${cam.x.toFixed(2)}|${cam.y.toFixed(2)}|${cam.z.toFixed(4)}|${vw}|${vh}`;
  if(key!==last){
    last=key;
    world.style.transform=`translate3d(${(vw/2-cam.x*cam.z).toFixed(2)}px,${(vh/2-cam.y*cam.z).toFixed(2)}px,0) scale(${cam.z.toFixed(4)})`;
    drawWall(vw/2-cam.x*cam.z, vh/2-cam.y*cam.z, cam.z);
    settle=0;
  } else if(window.__wallDirty){ drawWall(vw/2-cam.x*cam.z, vh/2-cam.y*cam.z, cam.z); }
  // once zoom has settled, re-rasterise the wall layer at the new scale so frames stay sharp
  if(++settle===12 && Math.abs(cam.z-rasterZ)/cam.z>0.04){
    rasterZ=cam.z; world.style.willChange="auto";
    requestAnimationFrame(()=>{ world.style.willChange="transform"; });
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener("resize",()=>{ fitZooms(); sizeWall(); sizeDark(); last=""; });

const glow=document.querySelector(".glow"), dark=document.querySelector(".dark"), dctx=dark.getContext("2d");
let glowX=innerWidth/2, glowY=innerHeight/2, glowDirty=true, flick=1, flickTo=1, flickT=0;
// darkness: drawn at 1/4 resolution and stretched by CSS (gradients stay smooth); lights are cut out of it
const DARK_RES=4;
function sizeDark(){ dark.width=Math.ceil(innerWidth/DARK_RES); dark.height=Math.ceil(innerHeight/DARK_RES); }
sizeDark();
// cursor candle: [radius px, how much light] — light 1 = no darkness
const HAND_LIGHT=[[0,1],[140,1],[280,.72],[470,.38],[700,.14],[980,.04],[1300,0]];
// candles standing on shelves light their own patch of wall
const CANDLES=candleFlames.map(pos=>({pos,f:1,to:1,t:0}));
const flameWorld=c=>c.pos;
function cutLight(x,y,stops,scale){
  const k=1/DARK_RES, R=stops[stops.length-1][0]*scale*k;
  const g=dctx.createRadialGradient(x*k,y*k,0,x*k,y*k,R);
  stops.forEach(([px,a])=>g.addColorStop(Math.min(1,px*scale*k/R),`rgba(0,0,0,${a})`));
  dctx.fillStyle=g; dctx.fillRect(x*k-R,y*k-R,2*R,2*R);
}
function drawDark(dt){
  const W=dark.width, H=dark.height;
  dctx.globalCompositeOperation="source-over"; dctx.fillStyle="rgba(2,1,0,.97)"; dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation="destination-out";
  cutLight(glowX,glowY,HAND_LIGHT,flick);
  CANDLES.forEach(c=>{
    if(!reduceMotion){ c.t-=dt; if(c.t<=0){ c.to=1+(Math.random()-.5)*.12; c.t=40+Math.random()*110; } c.f+=(c.to-c.f)*.25; }
    const [wx,wy]=flameWorld(c), sx=vw/2+(wx-cam.x)*cam.z, sy=vh/2+(wy-cam.y)*cam.z, z=cam.z*c.f;
    cutLight(sx,sy,[[0,.95],[30,.9],[90,.62],[170,.3],[260,.1],[340,0]],z);
  });
  dctx.globalCompositeOperation="source-over";
}
addEventListener("pointermove",e=>{
  glowX=e.clientX; glowY=e.clientY; glowDirty=true;
});

/* ---- zoom: wheel / keys / pinch, always toward a screen point ---- */
function zoomAt(newZ,sx,sy){
  newZ=clamp(newZ,zMin,zMax);
  // anchor from the current on-screen state, so repeated wheel ticks compound cleanly
  const wx=cam.x+(sx-vw/2)/cam.z, wy=cam.y+(sy-vh/2)/cam.z;
  anchor=null; inertia=false; cam.z=tgt.z=newZ;
  cam.x=tgt.x=wx-(sx-vw/2)/newZ; cam.y=tgt.y=wy-(sy-vh/2)/newZ;
  clampTarget(); cam.x=tgt.x; cam.y=tgt.y;
}
addEventListener("wheel",e=>{
  if(viewerOpen) return;
  e.preventDefault();
  const d=e.deltaMode===1?e.deltaY*16:e.deltaY;
  zoomAt(tgt.z*Math.exp(-d*(e.ctrlKey?.006:.0013)),e.clientX,e.clientY);
},{passive:false});
function resetView(){
  anchor=null; inertia=false; tgt.z=zMin;
  const [x0,x1]=rangeX(zMin), [y0,y1]=rangeY(zMin); tgt.x=(x0+x1)/2; tgt.y=(y0+y1)/2;
}

/* ---- drag to pan (mouse, pen, touch) + pinch ---- */
const ptrs=new Map(); let pinch=null;
const DRAG_THRESHOLD=6;
const stage=world.parentElement;
stage.addEventListener("pointerdown",e=>{
  if(viewerOpen) return;
  if(e.target.closest(".viewer")) return;
  if(e.pointerType==="mouse"&&e.button!==0) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    Object.assign(drag,{active:true,id:e.pointerId,moved:false,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,lt:performance.now(),vx:0,vy:0});
    inertia=false; anchor=null; tgt.x=cam.x; tgt.y=cam.y;
  } else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:tgt.z}; drag.moved=true;
  }
});
addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)) return;
  const p=ptrs.get(e.pointerId); p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()];
    zoomAt(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);
    return;
  }
  if(!drag.active||e.pointerId!==drag.id) return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<DRAG_THRESHOLD) return;
  if(!drag.moved){ drag.moved=true; document.body.classList.add("dragging"); drag.lx=e.clientX; drag.ly=e.clientY; }
  const now=performance.now(), dt=Math.max(1,now-drag.lt);
  let dx=-(e.clientX-drag.lx)/cam.z, dy=-(e.clientY-drag.ly)/cam.z;
  // resistance past the edge (rubber band)
  tgt.x+=dx; tgt.y+=dy; clampTarget(); cam.x=tgt.x; cam.y=tgt.y;
  drag.vx=drag.vx*.6+(dx/dt)*.4; drag.vy=drag.vy*.6+(dy/dt)*.4;
  drag.lx=e.clientX; drag.ly=e.clientY; drag.lt=now;
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
  if(e.pointerId===drag.id){
    drag.active=false; document.body.classList.remove("dragging");
    // only fling if the pointer was still moving at release
    const idle=performance.now()-drag.lt;
    inertia=false; void idle;
    if(!inertia){ drag.vx=drag.vy=0; }
  }
  if(ptrs.size===1){
    // a pinch finger lifted: continue panning with the remaining finger
    const [id,p]=[...ptrs.entries()][0];
    Object.assign(drag,{active:true,id,lx:p.x,ly:p.y,lt:performance.now(),vx:0,vy:0});
  }
}
addEventListener("pointerup",endPtr); addEventListener("pointercancel",endPtr);
// a drag that ends over a frame must not open it
addEventListener("click",e=>{ if(drag.moved){ e.stopPropagation(); e.preventDefault(); drag.moved=false; } },true);

/* ---- keyboard ---- */
ORDER.concat(CAB_ITEMS).filter(it=>it.work).forEach(it=>{
  it.el.addEventListener("click",e=>{ e.stopPropagation(); openViewer(it); });
  it.el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openViewer(it); } });
  it.el.addEventListener("focus",()=>{ if(!it.el.matches(":focus-visible")) return; anchor=null; inertia=false; tgt.x=it.x??it.wx; tgt.y=it.y??it.wy; });
});
addEventListener("keydown",e=>{
  if(viewerOpen) return;
  const step=140/cam.z;
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(k){ e.preventDefault(); anchor=null; inertia=false; tgt.x+=k[0]*step; tgt.y+=k[1]*step; }
  if(e.key==="+"||e.key==="=") zoomAt(tgt.z*1.2,vw/2,vh/2);
  if(e.key==="-") zoomAt(tgt.z/1.2,vw/2,vh/2);
  if(e.key==="0") resetView();
});

/* ================= viewer ================= */
const V={el:document.getElementById("viewer"),stage:document.getElementById("vStage"),frame:document.getElementById("vFrame"),
  count:document.getElementById("vCount"),cap:document.getElementById("vCaption"),dots:document.getElementById("vDots"),
  inv:document.getElementById("vInv"),title:document.getElementById("vTitle"),medium:document.getElementById("vMedium"),
  desc:document.getElementById("vDesc"),tags:document.getElementById("vTags"),close:document.getElementById("vClose")};
const CAPS=["Celkový pohled","Detail","Jiná varianta","Zblízka, teplé světlo"];
let cur=0, imgs=[], lastFocus=null;
function paintObjSlide(c,W,H,it,v){
  const r=R(it.seed*7+v);
  // backdrop: the same green wall, lit from above
  c.fillStyle=rad(c,W*.5,H*.32,0,W*.5,H*.45,W*.75,[[0,v===2?"#3a3a22":"#26443a"],[1,"#060d09"]]); c.fillRect(0,0,W,H);
  c.save(); c.globalAlpha=.06; c.fillStyle="#9fd0a8";
  for(let y=0;y<H;y+=H/5) for(let x=(y/(H/5))%2?W/10:0;x<W;x+=W/5){ c.beginPath(); c.ellipse(x,y,W*.025,H*.06,0,0,7); c.fill(); }
  c.restore();
  // object rendered large off-screen, then placed on a plank
  const oh=H*.66, ow=oh*it.aw/it.ah, off=document.createElement("canvas");
  off.width=Math.round(ow); off.height=Math.round(oh); OBJ[it.shelf](off.getContext("2d"),off.width,off.height,R(it.seed));
  const plankY=H*.86, ox=(W-ow)/2, oy=plankY-oh+4;
  c.save();
  if(v===1||v===3){ const z=v===1?1.9:1.45, fx=W/2+(r()-.5)*ow*.3, fy=oy+oh*(v===1?.35:.5); c.translate(fx,fy); c.scale(z,z); c.translate(-fx,-fy); }
  c.fillStyle=lin(c,0,plankY,0,plankY+H*.06,[[0,"#a87a4c"],[.12,"#6a4626"],[1,"#2e1b0d"]]); c.fillRect(-W,plankY,W*3,H*.06);
  c.fillStyle="rgba(0,0,0,.45)"; c.fillRect(-W,plankY+H*.06,W*3,H*.02);
  c.shadowColor="rgba(0,0,0,.55)"; c.shadowBlur=H*.04; c.shadowOffsetX=H*.02; c.shadowOffsetY=H*.025;
  c.drawImage(off,ox,oy,ow,oh);
  c.restore();
  if(v===2) glowDot(c,W*.15,H*.2,W*.6,"rgba(255,180,90,.18)");
  varnish(c,W,H,v===2);
}
function openViewer(it){
  lastFocus=document.activeElement; viewerOpen=true;
  V.inv.textContent=`inv. č. ${it.inv}`; V.title.textContent=it.title; V.medium.textContent=it.medium; V.desc.textContent=it.desc;
  V.tags.innerHTML=it.tags.map(t=>`<li>${t}</li>`).join("");
  const ar=it.shelf?4/3:it.aw/it.ah;
  V.frame.style.setProperty("--ar",ar.toFixed(4));
  V.stage.querySelectorAll("img").forEach(n=>n.remove()); V.dots.innerHTML="";
  const W=1200, H=Math.round(W/ar);
  imgs=[0,1,2,3].map(v=>{
    const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    if(it.shelf) paintObjSlide(cv.getContext("2d"),W,H,it,v); else paintArt(cv.getContext("2d"),W,H,it,v);
    const img=new Image(); img.alt=`${it.title}: ${CAPS[v]} (zástupný obraz)`; img.src=cv.toDataURL("image/jpeg",.88);
    V.stage.insertBefore(img,V.stage.firstChild);
    const d=document.createElement("button"); d.type="button"; d.setAttribute("aria-label",`Snímek ${v+1}`); d.addEventListener("click",()=>show(v)); V.dots.appendChild(d);
    return img;
  });
  V.el.hidden=false; show(0); V.close.focus();
}
function show(i){
  cur=(i+imgs.length)%imgs.length;
  imgs.forEach((im,k)=>im.classList.toggle("on",k===cur));
  [...V.dots.children].forEach((d,k)=>d.setAttribute("aria-current",k===cur?"true":"false"));
  V.count.textContent=`${ROMAN[cur]} / ${ROMAN[imgs.length-1]}`; V.cap.textContent=CAPS[cur];
}
function closeViewer(){ V.el.hidden=true; viewerOpen=false; last=""; if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true}); }
V.close.addEventListener("click",closeViewer);
document.getElementById("vPrev").addEventListener("click",()=>show(cur-1));
document.getElementById("vNext").addEventListener("click",()=>show(cur+1));
V.el.addEventListener("click",e=>{ if(e.target===V.el) closeViewer(); });
addEventListener("keydown",e=>{
  if(!viewerOpen) return;
  if(e.key==="Escape") closeViewer();
  if(e.key==="ArrowLeft") show(cur-1);
  if(e.key==="ArrowRight") show(cur+1);
});
let sx=null;
V.stage.addEventListener("pointerdown",e=>{ sx=e.clientX; });
V.stage.addEventListener("pointerup",e=>{ if(sx===null) return; const d=e.clientX-sx; sx=null; if(Math.abs(d)>40) show(cur+(d<0?1:-1)); });
})();
</script>
