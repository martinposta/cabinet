<!doctype html>
<html lang="en" data-exhibit="{{EXHIBIT}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<base href="{{ROOT}}">
{{META}}
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/cabinet.css?v={{V}}">
</head>
<body>
<noscript><p class="noscript">The cabinet needs JavaScript to open. <a href="list/">See the list of exhibits</a> instead.</p></noscript>
<div id="wall" aria-hidden="true"></div>
<canvas class="shadows" aria-hidden="true"></canvas>
<div id="world" aria-label="Wall of exhibits"></div>
<div class="glow" aria-hidden="true"></div>
<canvas class="dark" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle" hidden>
  <button class="close" id="vClose" type="button" aria-label="Close">×</button>
  <div class="viewer-inner">
    <div class="stage-wrap">
      <div class="stage-frame" id="vFrame">
        <div class="stage" id="vStage">
          <button class="nav prev" id="vPrev" type="button" aria-label="Previous slide">‹</button>
          <button class="nav next" id="vNext" type="button" aria-label="Next slide">›</button>
        </div>
      </div>
      <div class="slide-meta">
        <span class="count" id="vCount">I / IV</span>
        <span id="vCaption">Overall view</span>
        <span class="dots" id="vDots"></span>
      </div>
    </div>
    <article class="card"><div class="card-body">
      <div class="inv" id="vInv">inv. no. 001</div>
      <h2 id="vTitle">Time Transit</h2>
      <p class="medium" id="vMedium"></p>
      <div class="desc" id="vDesc"></div>
      <ul id="vTags"></ul>
      <p class="note">The pictures are placeholders. The finished cabinet will show photographs and footage from the project.</p>
    </div></article>
  </div>
</div>

<script type="module" src="js/main.js?v={{V}}"></script>
{{ANALYTICS}}
</body>
</html>
